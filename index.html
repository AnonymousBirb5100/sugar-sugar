<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="robots" content="noindex, nofollow">
        <title>Sugar, Sugar Unblocked on BirdHub</title>
        <link rel="shortcut icon" type="image/png" href="menu/favicon.png">
        <style>
            .background, .gameIframe {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vw;
                z-index: -1;
                pointer-events: none;
                overflow: hidden;
            }
            .gameIframe {
                display: none;
                z-index: 9999;
                border: none;
            }
            button {
                width: min-content;
                height: min-content;
                margin: auto;
                margin-left: 5vw;
                margin-right: 5vw;
                padding: 0;
                border: none;
                background-color:rgb(82, 44, 21);
                border-radius: 5vw;
                overflow: hidden;
                cursor: pointer;
                transition: 0.3s ease;
            }
            button img {
                width: 20vw;
                height: 20vw;
            }
            button:hover {
                transform: scale(1.1);
            }
            .buttons {
                display: flex;
                flex-direction: row;
                justify-content: center;
                margin-top: 5vw;
            }
            .buttonsAndText {
                display: flex;
                justify-content: center;
                text-align: center;
                flex-direction: column;
            }
            .buttonsAndText h1 {
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                color: black;
                font-size: 3vw;
                font-weight: bold;
                margin: 0;
                margin-top: 2vw;
            }
            .buttonsAndText p {
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                color: black;
                font-size: 2vw;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <img class="background" src="menu/sugarsugar-bg.png"/> <!--background-->
        <div class="buttons">
            <div class="buttonsAndText">
                <button onclick="window.location.href='sugarsugar.html'">
                    <img src="menu/sugarsugar-logo.png">
                </button>
                <h1>Play Sugar, Sugar 1</h1>
            </div>
            <div class="buttonsAndText">
                <button onclick="window.location.href='sugarsugar2.html'">
                    <img src="menu/sugarsugar-2-logo.png">
                </button>
                <h1>Play Sugar, Sugar 2</h1>
            </div>
        </div>
    </body>
</html>
